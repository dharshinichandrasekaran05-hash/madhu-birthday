<svg viewBox="0 0 600 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Divine temple placeholder for Lord Ayyappan" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="haloGrad" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#fff6da" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#ffd97a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffb648" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="archGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2a12"/>
      <stop offset="100%" stop-color="#1c130a"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7a5a22"/>
      <stop offset="50%" stop-color="#e8c15c"/>
      <stop offset="100%" stop-color="#7a5a22"/>
    </linearGradient>
    <linearGradient id="robeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e7b74f"/>
      <stop offset="100%" stop-color="#a5761f"/>
    </linearGradient>
  </defs>

  <!-- outer halo glow -->
  <circle cx="300" cy="300" r="300" fill="url(#haloGrad)"/>

  <!-- temple arch -->
  <path d="M60 700 L60 260 Q60 70 300 55 Q540 70 540 260 L540 700 Z"
        fill="url(#archGrad)" stroke="url(#goldEdge)" stroke-width="6"/>
  <path d="M110 700 L110 270 Q110 115 300 100 Q490 115 490 270 L490 700 Z"
        fill="none" stroke="#caa24e" stroke-width="2" opacity="0.5"/>

  <!-- pillars -->
  <rect x="60" y="640" width="480" height="18" fill="url(#goldEdge)"/>
  <rect x="40" y="658" width="60" height="30" fill="#2a1c0d" stroke="#caa24e" stroke-width="2"/>
  <rect x="500" y="658" width="60" height="30" fill="#2a1c0d" stroke="#caa24e" stroke-width="2"/>

  <!-- inner halo behind figure -->
  <circle cx="300" cy="330" r="150" fill="url(#haloGrad)"/>
  <circle cx="300" cy="330" r="108" fill="none" stroke="#f6d98a" stroke-width="2" opacity="0.6"/>

  <!-- seated divine silhouette (simple, respectful, abstract) -->
  <g>
    <!-- crown -->
    <path d="M300 210 L316 240 L340 245 L322 262 L328 288 L300 274 L272 288 L278 262 L260 245 L284 240 Z"
          fill="url(#robeGrad)" stroke="#7a5a22" stroke-width="2"/>
    <!-- head -->
    <circle cx="300" cy="300" r="34" fill="#5c3a1e"/>
    <!-- shoulders/torso -->
    <path d="M300 334
             C 250 334, 220 368, 214 420
             L 214 470
             Q 300 500 386 470
             L 386 420
             C 380 368, 350 334, 300 334 Z"
          fill="url(#robeGrad)" stroke="#7a5a22" stroke-width="2"/>
    <!-- seated legs / lotus base -->
    <path d="M200 470 Q300 520 400 470 L400 500 Q300 545 200 500 Z"
          fill="#c98f2e" stroke="#7a5a22" stroke-width="2"/>
    <!-- lotus base -->
    <g fill="#e7b74f" stroke="#7a5a22" stroke-width="1.5">
      <ellipse cx="300" cy="560" rx="130" ry="24"/>
      <path d="M180 560 Q220 520 300 528 Q380 520 420 560 Q360 590 300 590 Q240 590 180 560 Z"/>
    </g>
  </g>

  <!-- oil lamps flanking arch -->
  <g fill="#e8c15c">
    <circle cx="110" cy="620" r="6"/>
    <rect x="106" y="620" width="8" height="26" rx="2"/>
    <ellipse cx="110" cy="650" rx="20" ry="6"/>
    <circle cx="490" cy="620" r="6"/>
    <rect x="486" y="620" width="8" height="26" rx="2"/>
    <ellipse cx="490" cy="650" rx="20" ry="6"/>
  </g>
</svg>
